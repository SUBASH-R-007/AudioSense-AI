# Render blueprint — free web service.
#
# Render reads this from the repository root. The artifacts are committed, so
# the build only installs dependencies and stays inside the free tier's memory
# limit.

services:
  - type: web
    name: audiosense-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.ensure_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MPLCONFIGDIR
        value: /tmp
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      # Set CORS_ORIGINS to the deployed frontend URL in the dashboard.
